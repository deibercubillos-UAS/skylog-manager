  <rect x="784" y="196" width="392" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="804" y="216" width="34" height="34" rx="10" fill="#fde7d8"/>
  <rect x="814" y="228" width="14" height="10" rx="2" fill="none" stroke="#ec5b13" stroke-width="2"/>
