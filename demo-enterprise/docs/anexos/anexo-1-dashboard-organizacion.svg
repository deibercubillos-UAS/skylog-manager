<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="'Public Sans', system-ui, sans-serif">
  <rect width="1200" height="880" fill="#f1f5f9"/>

  <!-- Cinta de simulación -->
  <rect width="1200" height="26" fill="#fbbf24"/>
  <text x="600" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">Demostración con datos simulados — sin pagos reales, sin base de datos.</text>

  <!-- Header -->
  <rect x="0" y="26" width="1200" height="62" fill="#ffffff"/>
  <rect x="0" y="87" width="1200" height="1" fill="#e2e8f0"/>
  <rect x="24" y="44" width="28" height="28" rx="8" fill="#f1f5f9"/>
  <path d="M42 52 l-6 6 l6 6" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="60" y="44" width="28" height="28" rx="8" fill="#fde7d8"/>
  <circle cx="74" cy="58" r="6" fill="none" stroke="#ec5b13" stroke-width="2"/>
  <text x="98" y="52" font-size="9" font-weight="900" fill="#94a3b8" letter-spacing="1.5">PANEL ENTERPRISE</text>
  <text x="98" y="67" font-size="13" font-weight="900" fill="#0F1419" letter-spacing="-0.3">ORGANIZACIÓN DEMO</text>
  <rect x="1010" y="46" width="78" height="24" rx="8" fill="#f1f5f9"/>
  <text x="1049" y="62" text-anchor="middle" font-size="11" font-weight="900" fill="#64748b">API</text>
  <rect x="1098" y="46" width="78" height="24" rx="12" fill="#fef3c7"/>
  <text x="1137" y="62" text-anchor="middle" font-size="10" font-weight="900" fill="#b45309">DEMO</text>

  <!-- ===== Fila 1: Medidor de créditos + KPIs ===== -->
  <!-- Medidor -->
  <rect x="24" y="112" width="740" height="158" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="142" font-size="10" font-weight="900" fill="#94a3b8" letter-spacing="1.5">CRÉDITOS DISPONIBLES</text>
  <text x="48" y="182" font-size="40" font-weight="900" fill="#0F1419">500</text>
  <text x="142" y="182" font-size="15" font-weight="700" fill="#94a3b8">/ 500</text>
  <text x="48" y="202" font-size="12" fill="#94a3b8">≈ $ 500.000 en saldo</text>
  <rect x="620" y="130" width="120" height="40" rx="10" fill="#ec5b13"/>
  <text x="680" y="155" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">RECARGAR</text>
