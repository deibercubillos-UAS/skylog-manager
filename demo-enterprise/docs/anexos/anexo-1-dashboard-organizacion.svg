  <rect x="48" y="222" width="692" height="12" rx="6" fill="#f1f5f9"/>
  <rect x="48" y="222" width="692" height="12" rx="6" fill="#ec5b13"/>
  <text x="48" y="256" font-size="12" fill="#64748b"><tspan font-weight="700" fill="#334155">0</tspan> vuelos cargados este ciclo</text>
  <text x="740" y="256" text-anchor="end" font-size="12" fill="#94a3b8">Renueva: 18 jul 2026</text>

  <!-- KPI 1 -->
  <rect x="784" y="112" width="392" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="804" y="132" width="34" height="34" rx="10" fill="#fde7d8"/>
