<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Public Sans', system-ui, sans-serif">
  <rect width="1000" height="640" fill="#0f172a" opacity="0.5"/>

  <!-- Modal -->
  <rect x="260" y="40" width="480" height="560" rx="16" fill="#ffffff"/>
  <!-- header -->
  <circle cx="292" cy="74" r="8" fill="none" stroke="#ec5b13" stroke-width="2"/>
  <text x="312" y="68" font-size="9" font-weight="900" fill="#94a3b8" letter-spacing="1.2">REPLAY GPS</text>
  <text x="312" y="84" font-size="13" font-weight="900" fill="#0F1419">Inspección línea 230kV — Tramo A</text>
  <text x="712" y="80" text-anchor="end" font-size="16" fill="#94a3b8">✕</text>
  <rect x="260" y="98" width="480" height="1" fill="#f1f5f9"/>

  <!-- Mapa SVG (track) -->
  <rect x="276" y="112" width="448" height="240" rx="12" fill="#0f172a"/>
  <!-- grilla -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="330" y1="128" x2="330" y2="336"/><line x1="400" y1="128" x2="400" y2="336"/>
    <line x1="470" y1="128" x2="470" y2="336"/><line x1="540" y1="128" x2="540" y2="336"/>
    <line x1="610" y1="128" x2="610" y2="336"/><line x1="680" y1="128" x2="680" y2="336"/>
    <line x1="300" y1="160" x2="700" y2="160"/><line x1="300" y1="210" x2="700" y2="210"/>
    <line x1="300" y1="260" x2="700" y2="260"/><line x1="300" y1="310" x2="700" y2="310"/>
  </g>
  <!-- track completo (tenue) lawnmower -->
  <polyline points="320,150 680,150 680,200 320,200 320,250 680,250 680,300 320,300"
            fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- track recorrido (naranja) hasta ~55% -->
  <polyline points="320,150 680,150 680,200 320,200 320,250 540,250"
            fill="none" stroke="#ec5b13" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="320" cy="150" r="4" fill="#22c55e"/>
  <circle cx="540" cy="250" r="8" fill="#ec5b13" opacity="0.25"/>
  <circle cx="540" cy="250" r="4" fill="#ffffff" stroke="#ec5b13" stroke-width="2"/>

  <!-- Badge de cumplimiento -->
  <rect x="276" y="360" width="448" height="34" rx="0" fill="#d1fae5"/>
  <circle cx="296" cy="377" r="7" fill="none" stroke="#047857" stroke-width="2"/>
  <path d="M293 377 l2 2 l4 -4" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="312" y="382" font-size="12" font-weight="700" fill="#047857">Cumple el área asignada (±100 m) · desviación máx 26 m</text>

  <!-- Lecturas -->
  <g>
    <rect x="276" y="394" width="112" height="48" fill="#ffffff"/>
    <text x="332" y="412" text-anchor="middle" font-size="8" font-weight="900" fill="#94a3b8" letter-spacing="1">PROGRESO</text>
    <text x="332" y="430" text-anchor="middle" font-size="14" font-weight="900" fill="#0F1419">55%</text>
    <rect x="388" y="394" width="112" height="48" fill="#ffffff"/>
    <text x="444" y="412" text-anchor="middle" font-size="8" font-weight="900" fill="#94a3b8" letter-spacing="1">ALTITUD</text>
    <text x="444" y="430" text-anchor="middle" font-size="14" font-weight="900" fill="#0F1419">113 m</text>
    <rect x="500" y="394" width="112" height="48" fill="#ffffff"/>
    <text x="556" y="412" text-anchor="middle" font-size="8" font-weight="900" fill="#94a3b8" letter-spacing="1">TIEMPO</text>
    <text x="556" y="430" text-anchor="middle" font-size="14" font-weight="900" fill="#0F1419">12m</text>
    <rect x="612" y="394" width="112" height="48" fill="#ffffff"/>
    <text x="668" y="412" text-anchor="middle" font-size="8" font-weight="900" fill="#94a3b8" letter-spacing="1">PUNTO</text>
    <text x="668" y="430" text-anchor="middle" font-size="14" font-weight="900" fill="#0F1419">31/56</text>
    <rect x="276" y="392" width="448" height="2" fill="#f1f5f9"/>
  </g>

  <!-- Controles -->
  <circle cx="300" cy="476" r="20" fill="#ec5b13"/>
  <path d="M295 468 l0 16 M305 468 l0 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <rect x="336" y="472" width="372" height="8" rx="4" fill="#f1f5f9"/>
  <rect x="336" y="472" width="205" height="8" rx="4" fill="#ec5b13"/>
  <circle cx="541" cy="476" r="8" fill="#ec5b13"/>
  <text x="276" y="528" font-size="11" fill="#94a3b8">Trayectoria simulada. En producción se reconstruye del log DJI real (GPS/altitud por segundo).</text>

  <!-- nota cruce -->
  <rect x="276" y="548" width="448" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="292" y="566" font-size="10" font-weight="900" fill="#64748b">CRUCE DE RUTA (API)</text>
  <text x="292" y="582" font-size="10" fill="#94a3b8">within_tolerance: true · max_deviation_m: 26 · compliance_pct: 100 · tolerance_m: 100</text>
</svg>
