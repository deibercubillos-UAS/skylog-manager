<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A202C" />
  <title>Sin conexión — Bitafly</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1A202C;
      color: #e2e8f0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    }

    .icon {
      width: 72px;
      height: 72px;
      background: #ec5b1320;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #f7fafc;
      margin-bottom: 0.5rem;
    }

    p {
      color: #718096;
      font-size: 0.95rem;
      max-width: 320px;
      line-height: 1.6;
      margin: 0 auto 2rem;
    }

    .card {
      background: #2D3748;
      border: 1px solid #4A5568;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      max-width: 360px;
      width: 100%;
      text-align: left;
      margin-bottom: 2rem;
    }

    .card h2 {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #ec5b13;
      margin-bottom: 0.75rem;
    }

    .card ul {
      list-style: none;
      space-y: 0.5rem;
    }

    .card li {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #a0aec0;
      margin-bottom: 0.5rem;
    }

    .card li::before {
      content: '✓';
      color: #48bb78;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 0.05rem;
    }

    button {
      background: #ec5b13;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 360px;
      transition: opacity 0.2s;
    }

    button:active { opacity: 0.8; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      background: #2D3748;
      border: 1px solid #4A5568;
      border-radius: 9999px;
      padding: 0.35rem 0.875rem;
      font-size: 0.75rem;
      color: #a0aec0;
      margin-bottom: 2rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fc8181;
    }
  </style>
</head>
<body>
  <div class="icon">✈️</div>
  <h1>Sin conexión</h1>
  <p>No hay red disponible. Cuando recuperes señal, Bitafly sincronizará automáticamente.</p>

  <div class="badge">
    <span class="dot"></span>
    Modo offline
  </div>

  <div class="card">
    <h2>Disponible sin internet</h2>
    <ul>
      <li>Consultar vuelos ya cargados</li>
      <li>Ver bitácora en caché</li>
      <li>Revisar información de flota</li>
      <li>Consultar checklists guardados</li>
    </ul>
  </div>

  <button onclick="window.location.reload()">
    Reintentar conexión
  </button>

  <script>
    // Intentar recargar cuando la red vuelva
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
