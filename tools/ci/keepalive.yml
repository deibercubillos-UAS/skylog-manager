name: keepalive
# Evita el arranque en frío de la función y de Supabase: un ping cada 5 minutos (gratis en GitHub Actions).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 30 --retry 2 https://bitafly.com/api/health
